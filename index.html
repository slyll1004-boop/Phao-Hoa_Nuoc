<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Pháo Hoa Nước Kỳ Diệu</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(#eef4ff, #ffffff);
  text-align: center;
}

.item, .slot {
  width: 280px;        /* gấp 2 */
  height: 320px;       /* gấp 2 */
  border: 4px dashed #90caf9;
  border-radius: 32px;
  background: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.item img {
  width: 360px;        /* gấp 2 ảnh */
  height: auto;
}
.item img {
  width: 180px;         /* ảnh to hơn */
  height: auto;
}
h1 {
  margin-top: 36px;
}

#items, #slots {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 20px;
}

.item, .slot {
  width: 190px;
  height: 230px;
  border: 4px dashed #90caf9;
  border-radius: 35px;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.item {
  cursor: grab;
  box-shadow: 0 4px 8px rgba(0,0,0,0.12);
}

.item img {
  width: 130px;
  height: auto;
}

.symbol {
  font-size: 50px;
  font-weight: bold;
}

.label {
  margin-top: 6px;
  font-size: 15px;
  color: #444;
}

.correct {
  background: #e3f2fd !important;
  border-color: #42a5f5 !important;
}

#result {
  display: none;
  margin-top: 25px;
  font-size: 20px;
  color: #1565c0;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  border: none;
  background: #ff9800;
  color: white;
  font-size: 18px;
}
</style>
</head>
<style>
  item {
  touch-action: none;
  user-select: none;
}
</style>

<body>

<h1>🎆 SỰ KÌ DIỆU CỦA PHÁO HOA </h1>
<p>Kéo thả các vật để tạo ra pháo hoa nước</p>

<!-- VẬT LIỆU -->
<div id="items">
  <div class="item" draggable="true" data-value="oil">
    <img src="dau.jpg">
    <div class="label">Dầu ăn</div>
  </div>

  <div class="item" draggable="true" data-value="water">
    <img src="nuoc.jpg">
    <div class="label">Nước</div>
  </div>

  <div class="item" draggable="true" data-value="water">
    <img src="ly.jpg">
    <div class="label">Ly nhựa</div>
  </div>

  <div class="item" draggable="true" data-value="color">
    <img src="giot_mau.jpg">
    <div class="label">Màu</div>
  </div>

  <div class="item" draggable="true" data-value="tablet">
   <img src="xui.jpg">
    <div class="label">Viên sủi</div>
  </div>

  <div class="item" draggable="true" data-value="=">
   <img src="ten.jpg">
    <div class="label">Ta được</div>
  </div>

  <div class="item" draggable="true" data-value="firework">
   <img src="phao-hoa_nuoc.jpg">
    <div class="label">Pháo hoa nước</div>
  </div>
  
<!-- Ô SẮP XẾP -->
<div id="slots">
  <div class="slot"></div><div class="slot"></div><div class="slot"></div>
  <div class="slot"></div><div class="slot"></div><div class="slot"></div>
  <div class="slot"></div>
</div>

<!-- KẾT QUẢ -->
<div id="result">
  🌊✨ Sự kì diệu của pháo hoa đã xuất hiện!  
</div>

<button onclick="location.reload()">🔄 Chơi lại</button>

<script>
let draggedItem = null;

document.querySelectorAll(".item").forEach(item => {
  item.addEventListener("dragstart", () => draggedItem = item);
});
document.querySelectorAll(".slot").forEach(slot => {
  slot.addEventListener("dragover", e => e.preventDefault());
  slot.addEventListener("drop", () => {
    if (!slot.firstChild) {
      slot.appendChild(draggedItem);
      check();
    }
  });
});

function check() {
  const values = [...document.querySelectorAll(".slot")].map(
    s => s.firstChild ? s.firstChild.dataset.value : ""
  );

  const correct = ["water","water","oil","color","tablet","=","firework"];

  if (values.join() === correct.join()) {
    document.getElementById("result").style.display = "block";
    document.querySelectorAll(".slot").forEach(s => s.classList.add("correct"));
  }
}
</script>

</body>
</html>
